  note: >-
    Submitted via apis.io/add on 2026-08-14 (submission 6982bc11) from simon@veribimi.com.
    THIS PROFILE IS DELIBERATELY THIN, AND NOT BECAUSE THE PROVIDER PUBLISHES LITTLE.
    Every substantive artifact makeBIMI publishes is unreachable to any non-browser client.
    makebimi.com sits behind a Cloudflare MANAGED CHALLENGE: /, /public/apis.json,
    /public/openapi.yaml, /api-docs, /sitemap.xml and the /api/validate endpoint itself all
    return HTTP 403 with `cf-mitigated: challenge` and a "Just a moment..." interstitial. This
    was tested with a default client and with a desktop Chrome user-agent; both are refused, so
    it is not user-agent filtering. Only the three paths Cloudflare exempts by default get
    through: robots.txt, llms.txt and .well-known/security.txt.
    Everything recorded here is drawn from those three first-party documents. The OpenAPI and
    APIs.json pointers are recorded as the provider DECLARES them in llms.txt; neither has been
    fetched, so neither is verified. The artifacts are HIDDEN, not absent.
    Note the contradiction, which is the provider's to resolve: robots.txt says `Allow: /` for
    every user-agent and advertises a sitemap that is itself 403.
