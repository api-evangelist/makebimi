aid: makebimi
name: makeBIMI
description: >-
  makeBIMI is a free web tool for preparing and validating brand logos for BIMI (Brand Indicators
  for Message Identification). It converts supported image inputs to SVG Tiny P/S, checks SVG
  suitability, audits a domain's DMARC configuration, and suggests a BIMI DNS TXT record. It does
  not issue certificates and does not guarantee mailbox-provider logo display. The public API is a
  single unauthenticated endpoint, GET /api/validate, for validating a remotely hosted SVG in an
  automated workflow. Operated alongside veriBIMI, an independent BIMI certificate-brokerage and
  implementation-support service, and DMARCSwiss, a Swiss-hosted DMARC monitoring service.
